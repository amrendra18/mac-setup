summary: The 13 system UI settings are written from the profile as 14 keys with no restart, a second run changes nothing, and the harness restores each key.
level: fast
saves:
  - {domain: NSGlobalDomain, key: AppleInterfaceStyle}
  - {domain: NSGlobalDomain, key: AppleInterfaceStyleSwitchesAutomatically}
  - {domain: NSGlobalDomain, key: AppleAccentColor}
  - {domain: NSGlobalDomain, key: AppleHighlightColor}
  - {domain: com.apple.menuextra.clock, key: Show24Hour}
  - {domain: com.apple.menuextra.clock, key: ShowSeconds}
  - {domain: com.apple.menuextra.clock, key: FlashDateSeparators}
  - {domain: com.apple.controlcenter, key: Sound, host: currentHost}
  - {domain: com.apple.controlcenter, key: UserSwitcher, host: currentHost}
  - {domain: com.apple.ncprefs, key: play_forwarded_notifications_sounds}
  - {domain: com.apple.ncprefs, key: content_visibility}
  - {domain: com.apple.ncprefs, key: summarize_previews}
  - {domain: com.apple.assistant.support, key: Assistant Enabled}
  - {domain: com.apple.assistant.support, key: Search Queries Data Sharing Status}
setup:
  - |-
    while IFS='|' read -r h d n; do
    if defaults $h read-type "$d" "$n" >/dev/null 2>&1; then defaults $h delete "$d" "$n" || exit 1; fi
    done <<'KEYS'
    |NSGlobalDomain|AppleInterfaceStyle
    |NSGlobalDomain|AppleInterfaceStyleSwitchesAutomatically
    |NSGlobalDomain|AppleAccentColor
    |NSGlobalDomain|AppleHighlightColor
    |com.apple.menuextra.clock|Show24Hour
    |com.apple.menuextra.clock|ShowSeconds
    |com.apple.menuextra.clock|FlashDateSeparators
    -currentHost|com.apple.controlcenter|Sound
    -currentHost|com.apple.controlcenter|UserSwitcher
    |com.apple.ncprefs|play_forwarded_notifications_sounds
    |com.apple.ncprefs|content_visibility
    |com.apple.ncprefs|summarize_previews
    |com.apple.assistant.support|Assistant Enabled
    |com.apple.assistant.support|Search Queries Data Sharing Status
    KEYS
  - defaults write NSGlobalDomain AppleInterfaceStyleSwitchesAutomatically -bool false
  - defaults write NSGlobalDomain AppleHighlightColor -string '0.698039 0.843137 1.000000 Blue'
profile:
  default_settings:
    appearance.theme: dark
    appearance.accent_color: orange
    appearance.highlight_color: accent
    menu_bar.clock_24_hour: true
    menu_bar.clock_seconds: true
    menu_bar.clock_flash_separators: true
    menu_bar.sound: always
    menu_bar.user_switcher: show
    notifications.iphone_sounds: true
    notifications.show_previews: when_unlocked
    notifications.summarize: false
    siri.enabled: false
    spotlight.improve_search: "off"
runs:
  - name: check
    args: [--check]
    exit: 0
    recap: {changed: 14, failed: 0}
  - name: apply
    exit: 0
    recap: {changed: 14, failed: 0}
    output:
      - {pattern: '^RUNNING HANDLER ', count: 0}
      - {pattern: '^ +- log out and back in to see 2 settings$', count: 1}
  - name: apply-again
    exit: 0
    recap: {changed: 0, failed: 0}
reads:
  - {domain: NSGlobalDomain, key: AppleInterfaceStyle, type: string, value: Dark}
  - {domain: NSGlobalDomain, key: AppleInterfaceStyleSwitchesAutomatically, absent: true}
  - {domain: NSGlobalDomain, key: AppleAccentColor, type: integer, value: 1}
  - {domain: NSGlobalDomain, key: AppleHighlightColor, absent: true}
  - {domain: com.apple.menuextra.clock, key: Show24Hour, type: boolean, value: true}
  - {domain: com.apple.menuextra.clock, key: ShowSeconds, type: boolean, value: true}
  - {domain: com.apple.menuextra.clock, key: FlashDateSeparators, type: boolean, value: true}
  - {domain: com.apple.controlcenter, host: currentHost, key: Sound, type: integer, value: 18}
  - {domain: com.apple.controlcenter, host: currentHost, key: UserSwitcher, type: integer, value: 18}
  - {domain: com.apple.ncprefs, key: play_forwarded_notifications_sounds, type: boolean, value: true}
  - {domain: com.apple.ncprefs, key: content_visibility, type: integer, value: 2}
  - {domain: com.apple.ncprefs, key: summarize_previews, type: boolean, value: false}
  - {domain: com.apple.assistant.support, key: Assistant Enabled, type: boolean, value: false}
  - {domain: com.apple.assistant.support, key: Search Queries Data Sharing Status, type: integer, value: 2}
