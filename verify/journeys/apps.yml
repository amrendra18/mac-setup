summary: Without a VirusTotal key, a check run and an apply each refuse sublime_text with one line and exit 2, and install nothing.
level: full
setup:
  - rm -rf .local/apps-journey && mkdir -p .local/apps-journey/downloads .local/apps-journey/Applications
profile:
  machine_settings:
    apps.install: [sublime_text]
runs:
  - name: check-no-key
    args:
      - -e
      - "macos_apps_downloads={{ playbook_dir | dirname }}/.local/apps-journey/downloads"
      - -e
      - "macos_apps_applications={{ playbook_dir | dirname }}/.local/apps-journey/Applications"
      - --check
    exit: 2
    recap: {changed: 0, failed: 1, rescued: 1}
    output:
      - &refused-line
        pattern: '(?i)^(?!TASK |RUNNING HANDLER |\[ERROR\]|\d)[^\n]*\brefused sublime_text for machine: [^\n]*\bvirustotal check failed\b'
        count: 1
  - name: apply-no-key
    args:
      - -e
      - "macos_apps_downloads={{ playbook_dir | dirname }}/.local/apps-journey/downloads"
      - -e
      - "macos_apps_applications={{ playbook_dir | dirname }}/.local/apps-journey/Applications"
    exit: 2
    recap: {changed: 0, failed: 1, rescued: 1}
    output:
      - *refused-line
cleanup:
  - >-
    left=$(ls -A .local/apps-journey/Applications);
    echo "scratch Applications folder holds: ${left:-nothing}";
    rm -rf .local/apps-journey;
    test -z "$left"
