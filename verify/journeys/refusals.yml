summary: A setting macOS refuses does not stop the others; the Dock still restarts, and the run ends with exit 2 and one line for the refused setting.
level: fast
setup:
  - >-
    if [ -e .local/refusals-journey/saved.txt ]; then
    echo "an earlier cleanup did not finish; this run's cleanup restores .local/refusals-journey/saved.txt";
    exit 1; fi;
    mkdir -p .local/refusals-journey
  - >-
    for n in orientation tilesize show-recents; do
    if t=$(defaults read-type com.apple.dock "$n" 2>/dev/null); then t=${t#Type is };
    case $t in boolean|integer|float|string) ;; *) echo "cannot save com.apple.dock $n of type $t" >&2; exit 1 ;; esac;
    printf '%s %s %s\n' "$n" "$t" "$(defaults read com.apple.dock "$n")";
    else printf '%s absent\n' "$n"; fi;
    done > .local/refusals-journey/saved.txt
  - defaults delete com.apple.dock orientation || true
  - defaults delete com.apple.dock show-recents || true
  - defaults write com.apple.dock tilesize -int 48
profile:
  default_settings:
    dock.position: left
    dock.tile_size: 32
    dock.show_recents: false
runs:
  - name: check
    args: [--check]
    exit: 2
    recap: {changed: 2, failed: 1}
    output:
      - &refused-line {pattern: '(?i)^(?!TASK |RUNNING HANDLER |\[ERROR\]|\d)[^\n]*\brefused\b[^\n]*\bdock\.tile_size\b', count: 1}
  - name: apply
    exit: 2
    recap: {changed: 3, failed: 1}
    output:
      - *refused-line
      - {pattern: '^RUNNING HANDLER \[macos_defaults : Restart Dock\].*\nchanged: \[verify-mac\]', count: 1}
  - name: apply-again
    exit: 2
    recap: {changed: 0, failed: 1}
    output:
      - *refused-line
      - {pattern: '^RUNNING HANDLER \[macos_defaults : Restart Dock\]', count: 0}
reads:
  - {domain: com.apple.dock, key: orientation, type: string, value: left}
  - {domain: com.apple.dock, key: tilesize, type: integer, value: 48}
  - {domain: com.apple.dock, key: show-recents, type: boolean, value: false}
cleanup:
  - >-
    while read -r n t v; do
    case $t in
    absent) defaults delete com.apple.dock "$n" 2>/dev/null || true ;;
    boolean) if [ "$v" = 1 ]; then v=true; else v=false; fi; defaults write com.apple.dock "$n" -bool "$v" ;;
    integer) defaults write com.apple.dock "$n" -int "$v" ;;
    float) defaults write com.apple.dock "$n" -float "$v" ;;
    string) defaults write com.apple.dock "$n" -string "$v" ;;
    esac || { echo "could not restore com.apple.dock $n"; exit 1; };
    done < .local/refusals-journey/saved.txt || exit 1;
    rm .local/refusals-journey/saved.txt;
    killall Dock 2>/dev/null; true
