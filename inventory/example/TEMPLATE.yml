# Click-only settings. No script can set these. List one under default_settings or
# machine_settings, as its scope says, and playbooks/by-hand.yml walks you through it.

# Area: admin

# login_window.automatic_login_user
#   Account that logs in by itself at startup. Empty means nobody.
#   Scope: machine setting, needs admin
#   Values: text that matches ^[a-z_][a-z0-9_.-]{0,31}$
#   Where: System Settings > Users & Groups > Automatically log in as

# network.bluetooth_power
#   Turn Bluetooth on or off.
#   Scope: machine setting, needs admin
#   Values: true or false
#   Where: System Settings > Bluetooth
#   Note: macOS has no supported command to turn Bluetooth on or off.

# security.admin_password_for_settings
#   Ask for an admin password before changing system-wide settings.
#   Scope: machine setting, needs admin
#   Values: true or false
#   Where: System Settings > Privacy & Security > Advanced > Require an administrator password to
#     access system-wide settings

# security.filevault
#   Encrypt the startup disk with FileVault.
#   Scope: machine setting, needs admin
#   Values: true or false
#   Where: System Settings > Privacy & Security > FileVault

# security.gatekeeper
#   Check apps before they open (Gatekeeper).
#   Scope: machine setting, needs admin
#   Values: true or false
#   Where: System Settings > Privacy & Security > Security > Allow applications from
#   Note: Turning Gatekeeper off needs a click on macOS 15 and later. A command sets on, but off
#     needs a click, so the whole setting is by hand.

# security.gatekeeper_allow_identified_developers
#   Allow apps from identified developers, not only the App Store.
#   Scope: machine setting, needs admin
#   Values: true or false
#   Where: System Settings > Privacy & Security > Allow applications from: App Store and identified
#     developers

# sharing.file_sharing
#   Share folders with other computers over SMB (File Sharing).
#   Scope: machine setting, needs admin
#   Values: true or false
#   Where: System Settings > General > Sharing > File Sharing
#   Note: Turning it on also needs shared folders, so on is a click. A command sets off, but on
#     needs a click, so the whole setting is by hand.

# sharing.internet_sharing
#   Share this Mac's internet connection with other devices.
#   Scope: machine setting, needs admin
#   Values: true or false
#   Where: System Settings > General > Sharing > Internet Sharing

# sharing.remote_management
#   Allow Apple Remote Desktop to manage this Mac (Remote Management).
#   Scope: machine setting, needs admin
#   Values: true or false
#   Where: System Settings > General > Sharing > Remote Management

# time.zone_automatic
#   Set the time zone from the Mac's location.
#   Scope: machine setting, needs admin
#   Values: true or false
#   Where: System Settings > General > Date & Time > Set time zone automatically using your current
#     location
#   Note: Needs Location Services too, so the Date & Time pane is the safer path.

# Area: dock

# desktop.default_browser
#   App that opens web links.
#   Scope: account setting
#   Values: text that matches ^[A-Za-z0-9.-]+$
#   Where: System Settings > Desktop & Dock > Widgets > Default web browser
#   Note: macOS shows a confirmation dialog for any change, so a script cannot change it silently.
#     Apple's guide places it under Widgets in Desktop & Dock. The setting is the LaunchServices
#     handler for http and https.

# Area: input

# input.dictation
#   Turn on Dictation, which types what you say.
#   Scope: account setting
#   Values: "off", "on"
#   Where: System Settings > Keyboard
#   Note: Turning Dictation on shows a consent dialog and may download a language model, so a person
#     turns it on in the pane.

# Area: privacy

# privacy.improve_assistive_voice
#   Share Voice Control and Vocal Shortcuts audio with Apple.
#   Scope: account setting
#   Values: true or false
#   Where: System Settings > Privacy & Security > Analytics & Improvements

# privacy.location_services
#   Let apps and system services find where this Mac is.
#   Scope: machine setting, needs admin
#   Values: true or false
#   Where: System Settings > Privacy & Security > Location Services
#   Note: Reading works: the value sits in
#     /var/db/locationd/Library/Preferences/ByHost/com.apple.locationd.<hardware id>.plist, readable
#     as root with plutil. Writing it by script is not measured: the file belongs to _locationd.

# privacy.share_icloud_analytics
#   Share iCloud usage data with Apple.
#   Scope: account setting
#   Values: true or false
#   Where: System Settings > Privacy & Security > Analytics & Improvements

# Area: systemui

# appearance.icon_style
#   Icon and widget style (macOS 26 and later).
#   Scope: account setting
#   Values: default, dark, clear, tinted
#   Where: System Settings > Appearance

# appearance.liquid_glass
#   Liquid Glass look: Clear or Tinted (macOS 26.1 and later).
#   Scope: account setting
#   Values: clear, tinted
#   Where: System Settings > Appearance

# battery.optimized_charging
#   Optimized battery charging (laptops).
#   Scope: machine setting, needs admin
#   Values: true or false
#   Where: System Settings > Battery

# lock_screen.large_clock
#   Show the large clock on the lock screen and screen saver.
#   Scope: account setting
#   Values: by_hand
#   Where: System Settings > Lock Screen

# lock_screen.password_after
#   Ask for the password this many seconds after sleep or screen saver.
#   Scope: account setting
#   Values: 0, 5, 60, 300, 900, 3600, 28800, never
#   Where: System Settings > Lock Screen
#   Note: sysadminctl asks for the account's own password, so a person sets it.

# menu_bar.background
#   Show a solid menu bar background (macOS 26 and later).
#   Scope: account setting
#   Values: true or false
#   Where: System Settings > Control Center

# menu_bar.clock_announce
#   Say the time out loud on the hour.
#   Scope: account setting
#   Values: true or false
#   Where: System Settings > Control Center

# menu_bar.spotlight
#   Show the Spotlight icon in the menu bar.
#   Scope: account setting
#   Values: true or false
#   Where: System Settings > Control Center

# menu_bar.time_machine
#   Show Time Machine in the menu bar.
#   Scope: account setting
#   Values: show, hide
#   Where: System Settings > Control Center

# notifications.focus
#   Focus modes and their schedules.
#   Scope: account setting
#   Values: by_hand
#   Where: System Settings > Focus

# notifications.per_app
#   Notification style, sounds, and badges for each app.
#   Scope: account setting
#   Values: by_hand
#   Where: System Settings > Notifications

# notifications.when_display_sleeping
#   Allow notifications when the display is sleeping.
#   Scope: account setting
#   Values: true or false
#   Where: System Settings > Notifications

# notifications.when_locked
#   Allow notifications when the screen is locked.
#   Scope: account setting
#   Values: true or false
#   Where: System Settings > Notifications

# notifications.when_mirroring
#   Allow notifications when mirroring or sharing the display.
#   Scope: account setting
#   Values: true or false
#   Where: System Settings > Notifications

# screen_saver.choice
#   Which screen saver runs.
#   Scope: account setting
#   Values: by_hand
#   Where: System Settings > Screen Saver

# siri.apple_intelligence
#   Turn Apple Intelligence on.
#   Scope: account setting
#   Values: by_hand
#   Where: System Settings > Apple Intelligence & Siri

# siri.keyboard_shortcut
#   Keyboard shortcut that starts Siri.
#   Scope: account setting
#   Values: by_hand
#   Where: System Settings > Apple Intelligence & Siri

# siri.language_and_voice
#   Siri language and voice.
#   Scope: account setting
#   Values: by_hand
#   Where: System Settings > Apple Intelligence & Siri

# siri.listen_for
#   Listen for 'Siri' or 'Hey Siri'.
#   Scope: account setting
#   Values: true or false
#   Where: System Settings > Apple Intelligence & Siri

# sound.alert_device
#   Which device plays alert sounds.
#   Scope: account setting
#   Values: by_hand
#   Where: System Settings > Sound

# sound.input_device
#   Which microphone records sound.
#   Scope: account setting
#   Values: by_hand
#   Where: System Settings > Sound

# sound.output_device
#   Which speaker or headphones play sound.
#   Scope: account setting
#   Values: by_hand
#   Where: System Settings > Sound

# spotlight.categories
#   Which result categories Spotlight shows.
#   Scope: account setting
#   Values: by_hand
#   Where: System Settings > Spotlight
#   Note: Research note on when it takes effect: killall Spotlight (guess).

# spotlight.clipboard_history
#   Keep clipboard history in Spotlight (macOS 26 and later).
#   Scope: account setting
#   Values: true or false
#   Where: System Settings > Spotlight

# spotlight.privacy
#   Folders and disks Spotlight must not search.
#   Scope: machine setting, needs admin
#   Values: by_hand
#   Where: System Settings > Spotlight

# Not yet supported. mac-setup knows these settings but cannot set them yet.

# Area: admin

# password.minimum_length
#   Shortest password the Mac accepts for local accounts.
#   Scope: machine setting, needs admin
#   Not yet because: It sets the password rules for every account on this Mac, through pwpolicy or a
#     configuration profile, and mac-setup does not change security policy yet.

# Area: dock

# spaces.count
#   Number of Spaces (desktops) on each display.
#   Scope: account setting
#   Not yet because: No supported command adds or removes Spaces. The Dock owns the Spaces layout
#     and rewrites it while it runs. Add or remove Spaces in Mission Control.
#   Note: Monitors.0 is the first display only; a Mac with more displays has more Monitors entries.

# Area: input

# input.modifier_keys
#   Remap Caps Lock, Control, Option, Command and Globe for a keyboard.
#   Scope: account setting
#   Not yet because: macOS stores each remapping under a name made from one keyboard's hardware ids,
#     and no such entry exists until a key is remapped, so a profile cannot name it ahead of time.
#   Note: Stored per keyboard under -currentHost NSGlobalDomain as
#     com.apple.keyboard.modifiermapping.<vendor>-<product>-0. Research note on when it takes
#     effect: immediate for the UI; defaults write needs logout (reported). Page:
#     x-apple.systempreferences:com.apple.Keyboard-Settings.extension

# input.text_replacements
#   Typed shortcuts that expand to longer text, such as omw to On my way!.
#   Scope: account setting
#   Not yet because: macOS keeps the list in a database that iCloud syncs, and no supported command
#     writes it. Add replacements in System Settings > Keyboard > Text Replacements.
#   Note: The live list is a Core Data SQLite file. You can open the pane, or drag a .plist of
#     replacements from Finder into the list. Page:
#     x-apple.systempreferences:com.apple.Keyboard-Settings.extension

