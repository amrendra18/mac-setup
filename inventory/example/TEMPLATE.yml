  #   Values: true or false
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: nothing extra
  #   Proven on: macOS 27.2.1 (2026-11-12)

  # security.firewall: false
  #   Turn on the macOS firewall for incoming connections.
  #   Values: true or false
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: nothing extra
  #   Proven on: not yet

  # security.firewall_allow_builtin_signed: false
  #   Let built-in Apple software receive incoming connections.
  #   Values: true or false
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: nothing extra
  #   Proven on: not yet

  # security.firewall_allow_downloaded_signed: false
  #   Let downloaded signed software receive incoming connections.
  #   Values: true or false
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: nothing extra
  #   Proven on: not yet

  # security.firewall_block_all: false
  #   Block all incoming connections except basic network services.
  #   Values: true or false
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: nothing extra
  #   Proven on: not yet
  #   Warning: can lock you out of this Mac; it needs allow_lockout_risk: true

  # security.guest_enabled: false
  #   Allow the Guest User to log in to this Mac.
  #   Values: true or false
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: nothing extra
  #   Proven on: not yet
  #   Note: A defaults write does not create the Guest account record.

  # security.guest_shared_folders: false
  #   Let guests connect to shared folders without an account.
  #   Values: true or false
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: nothing extra
  #   Proven on: not yet
  #   Note: sysadminctl prints its state on stderr.

  # security.stealth: false
  #   Do not answer pings or probes from the network (stealth mode).
  #   Values: true or false
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: nothing extra
  #   Proven on: not yet

  # sharing.content_caching: false
  #   Cache Apple downloads for other devices on the network.
  #   Values: true or false
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: nothing extra
  #   Proven on: not yet
  #   Note: AssetCacheManagerUtil is the documented tool; a defaults write is not the route.

  # sharing.printer_sharing: false
  #   Share this Mac's printers with the network.
  #   Values: true or false
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: nothing extra
  #   Proven on: not yet

  # sharing.remote_apple_events: false
  #   Let other Macs send Apple events to apps here (Remote Application Scripting).
  #   Values: true or false
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: Full Disk Access
  #   Proven on: not yet

  # sharing.remote_login: false
  #   Allow SSH logins to this Mac (Remote Login).
  #   Values: true or false
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: Full Disk Access
  #   Proven on: not yet
  #   Warning: can lock you out of this Mac; it needs allow_lockout_risk: true
  #   Note: The lockout guard applies. -f stops systemsetup asking to confirm the off step.

  # sharing.screen_sharing: false
  #   Let others see and control this screen (Screen Sharing).
  #   Values: true or false
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: nothing extra
  #   Proven on: not yet
  #   Note: Medium confidence route; the safer path is the Sharing pane. Turning it off by script is
  #     not yet measured.

  # time.server: unset
  #   Network time server used to set the clock.
  #   Values: text that matches ^[A-Za-z0-9.-]{1,253}$
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: nothing extra
  #   Proven on: not yet
  #   Note: The read's output is not measured on macOS 27.

  # time.set_automatically: false
  #   Set the date and time from a network time server.
  #   Values: true or false
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: nothing extra
  #   Proven on: not yet
  #   Note: The read's output is not measured on macOS 27.

  # time.zone: unset
  #   Time zone, such as America/Vancouver. Used when automatic time zone is off.
  #   Values: text that matches ^[A-Za-z_]+(/[A-Za-z0-9_+-]+){0,2}$
  #   macOS default: not measured
  #   Takes effect: at once
  #   Needs: Full Disk Access
  #   Proven on: not yet
  #   Note: systemsetup prints Error -99 whether or not the set works, so the read after the set
  #     decides. Without Full Disk Access the time zone stays as it was. Measured on macOS 27.2.1
  #     over SSH, in a local Terminal without Full Disk Access, and in one with it. The zone must be
  #     a name that systemsetup -listtimezones prints. GMT is one, Etc/UTC is not.

