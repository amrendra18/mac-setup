[defaults]
inventory = .local/inventory
roles_path = roles
module_utils = ./module_utils
collections_path = .local/collections
home = .local/ansible-home
local_tmp = .local/ansible-home/tmp
remote_tmp = .local/ansible-home/remote-tmp
log_path = .local/logs/ansible.log
vault_password_file = scripts/vault-password
force_handlers = True
pipelining = True
callback_result_format = yaml
duplicate_dict_key = error

[inventory]
ignore_patterns = TEMPLATE
