---
finder.column_auto_size:
  summary: In column view, widen columns to fit filenames.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: com.apple.finder, key: _FXEnableColumnAutoSizing, type: bool}
  takes_effect: finder
  needs: []
  lockout_risk: false
  where: Column view > View > Show View Options > Resize columns
    to fit filenames (26.1 and later)
  proven_on: {}
  not_yet_reason: ""
finder.connected_servers:
  summary: Show connected servers on the desktop.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: com.apple.finder, key: ShowMountedServersOnDesktop, type: bool}
  takes_effect: finder
  needs: []
  lockout_risk: false
  where: same list > Connected servers
  proven_on: {}
  not_yet_reason: ""
finder.desktop_icons:
