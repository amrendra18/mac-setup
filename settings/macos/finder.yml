  takes_effect: finder
  needs: []
  lockout_risk: false
  where: Finder > Settings > Advanced > Keep folders on top >
    On Desktop
  proven_on: {}
  not_yet_reason: ""
finder.internal_drives:
  summary: Show internal disks on the desktop.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: com.apple.finder, key: ShowHardDrivesOnDesktop, type: bool}
  takes_effect: finder
  needs: []
  lockout_risk: false
  where: Finder > Settings > General > Show these items on the
    desktop > Hard disks
  proven_on: {}
  not_yet_reason: ""
finder.new_window:
  summary: Folder that a new Finder window opens.
  scope: user
  route: defaults
  values: [recents, computer, startup-disk, home, desktop, documents, icloud-drive]
  macos_default: not measured
  writes:
    - domain: com.apple.finder
      key: NewWindowTarget
      type: string
      map:
        recents: PfAF
        computer: PfCm
        startup-disk: PfVo
        home: PfHm
        desktop: PfDe
        documents: PfDo
        icloud-drive: PfID
  takes_effect: finder
  needs: []
  lockout_risk: false
  where: Finder > Settings > General > New Finder windows show
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
finder.no_network_ds_store:
  summary: Stop Finder writing .DS_Store files on network shares.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: com.apple.desktopservices, key: DSDontWriteNetworkStores, type: bool}
  takes_effect: logout
  needs: []
  lockout_risk: false
  where: No Settings row (hidden, documented by Apple)
  proven_on: {}
  not_yet_reason: ""
finder.open_folders_in_tabs:
  summary: Open folders in tabs instead of new windows.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
