screenshot.format:
  summary: File format for new screenshots.
  scope: user
  route: defaults
  values: [png, jpg, heic, pdf, tiff, gif]
  macos_default: not measured
  writes:
    - {domain: com.apple.screencapture, key: type, type: string}
  takes_effect: systemuiserver
  needs: []
  lockout_risk: false
  where: No Settings row; `screencapture -t` or Terminal only
  proven_on: {}
  not_yet_reason: ""
  notes: 'Research note on when it takes effect: `killall SystemUIServer`;
    a guess says macOS 15 and later need none.'
