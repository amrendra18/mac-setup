  proven_on: {}
  not_yet_reason: ""
finder.search_scope:
  summary: Where a Finder search looks first.
  scope: user
  route: defaults
  values: [mac, current-folder, previous]
  macos_default: not measured
  writes:
    - domain: com.apple.finder
      key: FXDefaultSearchScope
      type: string
      map: {mac: SCev, current-folder: SCcf, previous: SCsp}
  takes_effect: finder
  needs: []
  lockout_risk: false
  where: Finder > Settings > Advanced > When performing a search
  proven_on: {}
  not_yet_reason: ""
finder.show_extensions:
  summary: Show every filename extension in Finder.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: NSGlobalDomain, key: AppleShowAllExtensions, type: bool}
  takes_effect: finder
  needs: []
  lockout_risk: false
  where: Finder > Settings > Advanced > Show all filename extensions
  proven_on: {}
  not_yet_reason: ""
  notes: An early test applied this write and undid it exactly
    on macOS 27.2.1.
finder.show_hidden:
