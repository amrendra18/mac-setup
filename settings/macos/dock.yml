dock.show_open_indicators:
  summary: Show a dot under the Dock icon of each open app.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: com.apple.dock, key: show-process-indicators, type: bool}
  takes_effect: dock
  needs: []
  lockout_risk: false
  where: System Settings > Desktop & Dock > Dock > Show indicators
