mission_control.display_spaces:
  summary: Give each display its own Spaces, or share Spaces across
    displays.
  scope: user
  route: defaults
  values: [separate, shared]
  macos_default: not measured
  writes:
    - domain: com.apple.spaces
      key: spans-displays
      type: bool
      map: {separate: false, shared: true}
  takes_effect: logout
  needs: []
  lockout_risk: false
  where: System Settings > Desktop & Dock > Mission Control >
    Displays have separate Spaces
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
  notes: The stored value is the opposite of the switch in System
    Settings.
