  takes_effect: dock
  needs: []
  lockout_risk: false
  where: System Settings > Desktop & Dock > Dock > Animate opening
    applications
  proven_on: {}
  not_yet_reason: ""
dock.applications:
  summary: Apps kept in the Dock, by bundle ID.
  scope: user
  route: dock_apps
  values: {type: bundle_ids}
  macos_default: not measured
  takes_effect: dock
  needs: []
  lockout_risk: false
  where: Dock app tiles (drag in or out of the Dock)
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
  notes: The stored value is an array of tile dictionaries, not
    a single value. No stock Ansible module sets the Dock apps
    by bundle id.
dock.autohide:
  summary: Hide the Dock until the pointer reaches the screen
    edge.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
