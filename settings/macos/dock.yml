dock.minimize_effect:
  summary: Animation used when a window is minimized.
  scope: user
  route: defaults
  values: [genie, scale]
  macos_default: not measured
  writes:
    - {domain: com.apple.dock, key: mineffect, type: string}
  takes_effect: dock
  needs: []
  lockout_risk: false
  where: System Settings > Desktop & Dock > Dock > Minimize windows
