  summary: Reorder Spaces by most recent use.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: com.apple.dock, key: mru-spaces, type: bool}
  takes_effect: dock
  needs: []
  lockout_risk: false
  where: System Settings > Desktop & Dock > Mission Control >
    Automatically rearrange Spaces based on most recent use
  proven_on: {}
  not_yet_reason: ""
mission_control.shortcuts:
  summary: Keys for Mission Control, app windows, Show Desktop
    and Space switching.
  scope: user
  route: defaults
  values:
    type: hotkeys
    actions:
      mission_control: 32
      application_windows: 33
      show_desktop: 36
      move_left_a_space: 79
      move_right_a_space: 81
      switch_to_desktop_1: 118
      switch_to_desktop_2: 119
      switch_to_desktop_3: 120
      switch_to_desktop_4: 121
      switch_to_desktop_5: 122
      switch_to_desktop_6: 123
      switch_to_desktop_7: 124
      switch_to_desktop_8: 125
      switch_to_desktop_9: 126
  macos_default: not measured
  writes:
    - {domain: com.apple.symbolichotkeys, key: AppleSymbolicHotKeys, type: dict, dict_mode: add}
  takes_effect: logout
  needs: []
  lockout_risk: false
  where: System Settings > Desktop & Dock > Mission Control >
    Shortcuts (also Keyboard > Keyboard Shortcuts > Mission Control)
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
  notes: 'true turns a shortcut on with its standard keys, false
    turns it off, and keys such as control+up replace its keys.
    Each action writes its own numbered entry in AppleSymbolicHotKeys
    in com.apple.symbolichotkeys, and the other entries stay as they
    are. The numbers are community knowledge, not measured. A test
    Mac with macOS 15 stores the two move one Space entries as {enabled:
    true} (measured). Research note on when it takes effect: log
    out, or run the private activateSettings -u tool (guess, not
    tested). Page: x-apple.systempreferences:com.apple.Keyboard-Settings.extension'
