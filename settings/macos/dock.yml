spaces.count:
  summary: Number of Spaces (desktops) on each display.
  scope: user
  route: not_yet
  values: [not_yet]
  macos_default: not measured
  takes_effect: live
  needs: [click]
  lockout_risk: false
  where: Mission Control (F3) > + button on the Spaces bar
  proven_on: {}
  not_yet_reason: No supported command adds or removes Spaces. The
    Dock owns the Spaces layout and rewrites it while it runs. Add
    or remove Spaces in Mission Control.
  notes: Monitors.0 is the first display only; a Mac with more
    displays has more Monitors entries. No safe write is known,
    because the Dock owns SpacesDisplayConfiguration in com.apple.spaces
    and rewrites it, and writing it while the Dock runs is unsupported
    (inferred).
stage_manager.app_windows:
  summary: Bring forward all of an app's windows, or one at a
    time.
  scope: user
  route: defaults
  values: [all_at_once, one_at_a_time]
  macos_default: not measured
  writes:
    - domain: com.apple.WindowManager
      key: AppWindowGroupingBehavior
      type: int
      map: {all_at_once: 0, one_at_a_time: 1}
  takes_effect: logout
  needs: []
  lockout_risk: false
  where: System Settings > Desktop & Dock > Desktop & Stage Manager
    > Show windows from an application
  proven_on: {}
  not_yet_reason: ""
  notes: 'The map from 0 and 1 to the two labels is a guess. Research
    note on when it takes effect: Guess: WindowManager may pick
    the change up live, or need killall WindowManager. Not tested.'
stage_manager.enabled:
