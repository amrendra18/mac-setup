  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
dock.title_bar_double_click:
  summary: What a double-click on a window title bar does.
  scope: user
  route: defaults
  values: [fill, zoom, minimize, none]
  macos_default: not measured
  writes:
    - domain: NSGlobalDomain
      key: AppleActionOnDoubleClick
      type: string
      map: {fill: Fill, zoom: Maximize, minimize: Minimize, none: None}
  takes_effect: relaunch
  needs: []
  lockout_risk: false
  where: System Settings > Desktop & Dock > Dock > Double-click
    a window's title bar to
  proven_on: {}
  not_yet_reason: ""
  notes: 'The stored words Fill, Maximize, Minimize and None were
    found in DesktopSettings.appex on macOS 15.6.1. The map from
    label to word is inferred. System Settings may also write
    the older key AppleMiniaturizeOnDoubleClick. Research note
    on when it takes effect: running apps read NSGlobalDomain
    at launch, so quit and reopen apps, or log out (inferred).'
hot_corners.bottom_left:
  summary: Action when the pointer reaches the bottom left screen
    corner.
  scope: user
  route: defaults
  values:
    - none
    - mission_control
    - app_windows
    - desktop
    - start_screen_saver
    - disable_screen_saver
    - display_sleep
    - launchpad
    - notification_center
    - lock_screen
    - quick_note
  macos_default: not measured
  writes:
    - domain: com.apple.dock
      key: wvous-bl-corner
      type: int
      map:
        none: 1
        mission_control: 2
        app_windows: 3
        desktop: 4
        start_screen_saver: 5
        disable_screen_saver: 6
        display_sleep: 10
        launchpad: 11
        notification_center: 12
        lock_screen: 13
        quick_note: 14
  takes_effect: dock
  needs: []
  lockout_risk: false
  where: System Settings > Desktop & Dock > Hot Corners > bottom
    left menu
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
  notes: Code 14 (Quick Note) was measured on a test Mac. Codes
    1 to 13 are community knowledge. macOS 26 shows Apps instead
    of Launchpad; whether code 11 now opens Apps is not proven.
    Dashboard (7) is gone and left out.
hot_corners.bottom_left_modifier:
  summary: Key that must be held for the bottom left hot corner.
  scope: user
  route: defaults
  values: [none, shift, control, option, command]
  macos_default: not measured
  writes:
    - domain: com.apple.dock
      key: wvous-bl-modifier
      type: int
      map: {none: 0, shift: 131072, control: 262144, option: 524288, command: 1048576}
  takes_effect: dock
  needs: []
  lockout_risk: false
  where: System Settings > Desktop & Dock > Hot Corners > bottom
    left menu, hold a modifier key while choosing
  proven_on: {}
  not_yet_reason: ""
  notes: The value is a bit mask, so keys can be combined (Apple's
    guide says so). The choices list single keys only.
