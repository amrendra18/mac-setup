---
dock.position:
  summary: Which edge of the screen the Dock sits on.
  scope: user
  route: defaults
  values: [left, bottom, right]
  macos_default: not measured
  writes:
    - {domain: com.apple.dock, key: orientation, type: string}
  takes_effect: dock
  needs: []
  lockout_risk: false
  where: System Settings > Desktop & Dock > Position on screen
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
dock.tile_size:
  summary: How big the Dock icons are, in points.
  scope: user
  route: defaults
  values: {type: int, min: 16, max: 128}
  macos_default: not measured
  writes:
    - {domain: com.apple.dock, key: tilesize, type: float}
  takes_effect: dock
  needs: []
  lockout_risk: false
  where: System Settings > Desktop & Dock > Size
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
dock.show_recents:
  summary: Whether the Dock shows suggested and recent apps in their own section.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: com.apple.dock, key: show-recents, type: bool}
  takes_effect: dock
  needs: []
  lockout_risk: false
  where: System Settings > Desktop & Dock > Show suggested and recent apps in Dock
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
desktop.click_wallpaper_reveals:
  summary: When a click on the wallpaper moves windows aside to
    show the desktop.
  scope: user
  route: defaults
  values: [always, stage_manager_only]
  macos_default: not measured
  writes:
    - domain: com.apple.WindowManager
      key: EnableStandardClickToShowDesktop
      type: bool
      map: {always: true, stage_manager_only: false}
  takes_effect: logout
  needs: []
  lockout_risk: false
  where: System Settings > Desktop & Dock > Desktop & Stage Manager
    > Click wallpaper to reveal desktop
  proven_on: {}
  not_yet_reason: ""
  notes: 'macOS 26 labels the choices ''Always on Wallpaper Click''
    and ''Only in Stage Manager on Click''. Research note on when
    it takes effect: Guess: WindowManager may pick the change
    up live, or need killall WindowManager. Not tested.'
desktop.default_browser:
  summary: App that opens web links.
  scope: user
  route: by_hand
  values: {type: text, pattern: '^[A-Za-z0-9.-]+$'}
  macos_default: not measured
  takes_effect: live
  needs: [click]
  lockout_risk: false
  where: System Settings > Desktop & Dock > Widgets > Default
    web browser
  link: x-apple.systempreferences:com.apple.Desktop-Settings.extension
  proven_on: {}
  not_yet_reason: ""
  notes: macOS shows a confirmation dialog for any change, so
    a script cannot change it silently. Apple's guide places it
    under Widgets in Desktop & Dock. The setting is the LaunchServices
    handler for http and https.
desktop.items_in_stage_manager:
  summary: Show desktop files and folders while Stage Manager
    is on.
  scope: user
  route: defaults
  values: [show, hide]
  macos_default: not measured
  writes:
    - domain: com.apple.WindowManager
      key: HideDesktop
      type: bool
      map: {show: false, hide: true}
  takes_effect: logout
  needs: []
  lockout_risk: false
  where: 'System Settings > Desktop & Dock > Desktop & Stage Manager
    > Show Items: In Stage Manager'
  proven_on: {}
  not_yet_reason: ""
  notes: 'Research note on when it takes effect: Guess: WindowManager
    may pick the change up live, or need killall WindowManager.
    Not tested.'
desktop.items_on_desktop:
  summary: Show files and folders on the desktop.
  scope: user
  route: defaults
  values: [show, hide]
  macos_default: not measured
  writes:
    - domain: com.apple.WindowManager
      key: StandardHideDesktopIcons
      type: bool
      map: {show: false, hide: true}
  takes_effect: logout
  needs: []
  lockout_risk: false
  where: 'System Settings > Desktop & Dock > Desktop & Stage Manager
    > Show Items: On Desktop'
  proven_on: {}
  not_yet_reason: ""
  notes: 'Research note on when it takes effect: Guess: Finder
    or WindowManager may need a restart. Not tested.'
desktop.wallpaper:
  summary: The solid color every desktop shows.
  scope: user
  route: wallpaper
  values: [black]
  macos_default: not measured
  takes_effect: live
  needs: []
  lockout_risk: false
  where: System Settings > Wallpaper > Colors
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
dock.animate_opening:
