---
input.app_expose_gesture:
  summary: Gesture to show all windows of the current app (swipe
    down).
  scope: user
  route: defaults
  values: ['off', three_finger, four_finger]
  macos_default: not measured
  writes:
    - domain: com.apple.AppleMultitouchTrackpad
      key: TrackpadThreeFingerVertSwipeGesture
      type: int
      map: {three_finger: 2, four_finger: 0}
    - domain: com.apple.AppleMultitouchTrackpad
      key: TrackpadFourFingerVertSwipeGesture
      type: int
      map: {three_finger: 0, four_finger: 2}
    - domain: com.apple.dock
      key: showAppExposeGestureEnabled
      type: bool
      map: {'off': false, three_finger: true, four_finger: true}
  takes_effect: dock
  needs: []
  lockout_risk: false
  where: System Settings > Trackpad
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
  notes: 'It shares the two finger keys with input.mission_control_gesture.
    off writes only its Dock key and leaves the finger keys alone.
    That the Dock key alone turns the gesture off is not tested.
    When both gestures are on, they use the same number of fingers,
    and the profile check refuses a pair that disagrees. Research
    note on when it takes effect: Dock restart; not tested.'
input.auto_capitalize:
  summary: Capitalize the first word of a sentence automatically.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: NSGlobalDomain, key: NSAutomaticCapitalizationEnabled, type: bool}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Keyboard
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
  notes: 'Research note on when it takes effect: each app after
    it relaunches; not tested.'
input.auto_correct:
  summary: Correct spelling automatically while typing.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: NSGlobalDomain, key: NSAutomaticSpellingCorrectionEnabled, type: bool}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Keyboard
  proven_on: {}
  not_yet_reason: ""
  notes: 'System Settings may also write WebAutomaticSpellingCorrectionEnabled,
    which WebKit text fields use (unverified). Research note on
    when it takes effect: each app after it relaunches; not tested.'
input.dictation:
  summary: Turn on Dictation, which types what you say.
  scope: user
  route: by_hand
  values: ['off', 'on']
  macos_default: not measured
  takes_effect: not measured
  needs: [click]
  lockout_risk: false
  where: System Settings > Keyboard
  link: x-apple.systempreferences:com.apple.Keyboard-Settings.extension
  proven_on: {}
  not_yet_reason: ""
  notes: Turning Dictation on shows a consent dialog and may download a language
    model, so a person turns it on in the pane.
input.double_click_speed:
  summary: How quickly two clicks must follow each other to count
    as a double-click.
  scope: user
  route: defaults
  values: {type: float, min: 0.0, max: 5.0}
  macos_default: not measured
  writes:
    - {domain: NSGlobalDomain, key: com.apple.mouse.doubleClickThreshold, type: float}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Accessibility
  proven_on: {}
  not_yet_reason: ""
  notes: The unit is seconds (inferred).
input.double_space_period:
  summary: Typing two spaces adds a period.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: NSGlobalDomain, key: NSAutomaticPeriodSubstitutionEnabled, type: bool}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Keyboard
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
  notes: 'Research note on when it takes effect: each app after
    it relaunches; not tested.'
input.fn_key_action:
  summary: What pressing the fn or Globe key does.
  scope: user
  route: defaults
  values: [change_input_source, show_emoji, start_dictation, do_nothing]
  macos_default: not measured
  writes:
    - domain: com.apple.HIToolbox
      key: AppleFnUsageType
      type: int
      map: {change_input_source: 1, show_emoji: 2, start_dictation: 3, do_nothing: 0}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Keyboard
  proven_on: {}
  not_yet_reason: ""
  notes: 'Research note on when it takes effect: a restart, one
    source says; logout not tested.'
input.force_click:
  summary: Force Click and haptic feedback on a Force Touch trackpad.
  scope: user
  route: defaults
  values: ['off', 'on']
  macos_default: not measured
  writes:
    - domain: com.apple.AppleMultitouchTrackpad
      key: ActuateDetents
      type: int
      map: {'off': 0, 'on': 1}
    - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
      key: ActuateDetents
      type: int
      map: {'off': 0, 'on': 1}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Trackpad
  proven_on: {}
  not_yet_reason: ""
  notes: ForceSuppressed (boolean, inverted) likely changes with it.
input.inline_predictive_text:
  summary: Show predicted words inline while typing.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: NSGlobalDomain, key: NSAutomaticInlinePredictionEnabled, type: bool}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Keyboard
  proven_on: {}
  not_yet_reason: ""
  notes: 'Key name unproven. Research note on when it takes effect:
    each app after it relaunches; not tested.'
input.input_sources:
  summary: Keyboard layouts turned on, in the order the input menu
    lists them.
  scope: user
  route: defaults
  values:
    type: list
    min: 1
    choices: [us, abc, british, canadian, dvorak, french, german, emoji_and_symbols]
  macos_default: not measured
  writes:
    - domain: com.apple.HIToolbox
      key: AppleEnabledInputSources
      type: array
      map:
        us: {InputSourceKind: Keyboard Layout, KeyboardLayout ID: 0, KeyboardLayout Name: U.S.}
        abc: {InputSourceKind: Keyboard Layout, KeyboardLayout ID: 252, KeyboardLayout Name: ABC}
        british: {InputSourceKind: Keyboard Layout, KeyboardLayout ID: 2, KeyboardLayout Name: British}
        canadian: {InputSourceKind: Keyboard Layout, KeyboardLayout ID: 29, KeyboardLayout Name: Canadian}
        dvorak: {InputSourceKind: Keyboard Layout, KeyboardLayout ID: 16300, KeyboardLayout Name: Dvorak}
        french: {InputSourceKind: Keyboard Layout, KeyboardLayout ID: 1, KeyboardLayout Name: French}
        german: {InputSourceKind: Keyboard Layout, KeyboardLayout ID: 3, KeyboardLayout Name: German}
        emoji_and_symbols: {Bundle ID: com.apple.CharacterPaletteIM, InputSourceKind: Non Keyboard Input Method}
  takes_effect: logout
  needs: []
  lockout_risk: false
  where: System Settings > Keyboard
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
  notes: 'The list replaces the whole AppleEnabledInputSources array
    in com.apple.HIToolbox, so list at least one keyboard layout.
    emoji_and_symbols is the Emoji & Symbols viewer, which macOS
    turns on by itself. The layout numbers come from community
    lists. Input methods that type other scripts are not offered
    yet. Research note on when it takes effect: logout; list writes
    are reported fragile. Page: x-apple.systempreferences:com.apple.Keyboard-Settings.extension'
input.key_repeat:
  summary: How fast a held key repeats. Smaller is faster; the
    slider runs from 120 to 2.
  scope: user
  route: defaults
  values: {type: int, min: 1, max: 120}
  macos_default: not measured
  writes:
    - {domain: NSGlobalDomain, key: KeyRepeat, type: int}
  takes_effect: logout
  needs: []
  lockout_risk: false
  where: System Settings > Keyboard
  proven_on: {}
  not_yet_reason: ""
input.keyboard_navigation:
  summary: Move focus between all controls with Tab and Shift-Tab.
  scope: user
  route: defaults
  values: ['off', 'on']
  macos_default: not measured
  writes:
    - domain: NSGlobalDomain
      key: AppleKeyboardUIMode
      type: int
      map: {'off': 0, 'on': 2}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Keyboard
  proven_on: {}
  not_yet_reason: ""
  notes: 'A choice instead of true or false, because the stored
    value is 0 or 2. macOS 12 and older used 3 for on; that reads
    as unknown. Research note on when it takes effect: apps opened
    after the change; not tested.'
input.keyboard_shortcuts:
  summary: Turn system keyboard shortcuts on or off and change
    their keys.
  scope: user
  route: defaults
  values:
    type: hotkeys
    actions:
      focus_menu_bar: 7
      focus_dock: 8
      screenshot_screen_to_file: 28
      screenshot_screen_to_clipboard: 29
      screenshot_area_to_file: 30
      screenshot_area_to_clipboard: 31
      previous_input_source: 60
      next_input_source: 61
      spotlight_search: 64
      finder_search_window: 65
      screenshot_options: 184
  macos_default: not measured
  writes:
    - {domain: com.apple.symbolichotkeys, key: AppleSymbolicHotKeys, type: dict, dict_mode: add}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Keyboard
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
  notes: 'true turns a shortcut on with its standard keys, false
    turns it off, and keys such as command+shift+5 replace its keys.
    Each action writes its own numbered entry in AppleSymbolicHotKeys
    in com.apple.symbolichotkeys, and the other entries stay as they
    are. The action numbers and key codes come from community lists.
    The Mission Control keys are in mission_control.shortcuts. Research
    note on when it takes effect: logout, or activateSettings -u
    (reported, not tested). Page: x-apple.systempreferences:com.apple.Keyboard-Settings.extension'
input.launchpad_gesture:
  summary: Pinch with thumb and three fingers to open Launchpad
    (macOS 15 only).
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: com.apple.dock, key: showLaunchpadGestureEnabled, type: bool}
  takes_effect: dock
  needs: []
  lockout_risk: false
  where: System Settings > Trackpad
  proven_on: {}
  not_yet_reason: ""
  notes: 'macOS 15 only. Research note on when it takes effect:
    Dock restart; not tested.'
input.look_up_gesture:
  summary: Gesture for Look up and data detectors.
  scope: user
  route: defaults
  values: ['off', force_click, three_finger_tap]
  macos_default: not measured
  writes:
    - domain: NSGlobalDomain
      key: com.apple.trackpad.forceClick
      type: bool
      map: {'off': false, force_click: true, three_finger_tap: false}
    - domain: com.apple.AppleMultitouchTrackpad
      key: TrackpadThreeFingerTapGesture
      type: int
      map: {'off': 0, force_click: 0, three_finger_tap: 2}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Trackpad
  proven_on: {}
  not_yet_reason: ""
  notes: One menu in System Settings sets two keys. The values found on a test
    Mac do not fit the map, so the map is unproven.
input.mission_control_gesture:
  summary: Gesture to open Mission Control (swipe up).
  scope: user
  route: defaults
  values: ['off', three_finger, four_finger]
  macos_default: not measured
  writes:
    - domain: com.apple.AppleMultitouchTrackpad
      key: TrackpadThreeFingerVertSwipeGesture
      type: int
      map: {three_finger: 2, four_finger: 0}
    - domain: com.apple.AppleMultitouchTrackpad
      key: TrackpadFourFingerVertSwipeGesture
      type: int
      map: {three_finger: 0, four_finger: 2}
    - domain: com.apple.dock
      key: showMissionControlGestureEnabled
      type: bool
      map: {'off': false, three_finger: true, four_finger: true}
  takes_effect: dock
  needs: []
  lockout_risk: false
  where: System Settings > Trackpad
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
  notes: 'One menu in System Settings sets three keys. It shares
    the two finger keys with input.app_expose_gesture. off writes
    only its Dock key and leaves the finger keys alone. That the
    Dock key alone turns the gesture off is not tested. When both
    gestures are on, they use the same number of fingers, and the
    profile check refuses a pair that disagrees. Research note on
    when it takes effect: Dock restart (killall Dock) plus a trackpad
    reload; not tested.'
input.modifier_keys:
  summary: Remap Caps Lock, Control, Option, Command and Globe
    for a keyboard.
  scope: user
  route: not_yet
  values: [not_yet]
  macos_default: not measured
  takes_effect: logout
  needs: [click]
  lockout_risk: false
  where: System Settings > Keyboard
  proven_on: {}
  not_yet_reason: macOS stores each remapping under a name made
    from one keyboard's hardware ids, and no such entry exists until
    a key is remapped, so a profile cannot name it ahead of time.
  notes: 'Stored per keyboard under -currentHost NSGlobalDomain
    as com.apple.keyboard.modifiermapping.<vendor>-<product>-0.
    Research note on when it takes effect: immediate for the UI;
    defaults write needs logout (reported).
    Page: x-apple.systempreferences:com.apple.Keyboard-Settings.extension'
input.mouse_mission_control:
  summary: Double-tap a Magic Mouse with two fingers to open Mission
    Control.
  scope: user
  route: defaults
  values: ['off', 'on']
  macos_default: not measured
  writes:
    - domain: com.apple.AppleMultitouchMouse
      key: MouseTwoFingerDoubleTapGesture
      type: int
      map: {'off': 0, 'on': 3}
    - domain: com.apple.driver.AppleBluetoothMultitouch.mouse
      key: MouseTwoFingerDoubleTapGesture
      type: int
      map: {'off': 0, 'on': 3}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Mouse
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
input.mouse_scroll_speed:
  summary: How fast content scrolls with a mouse wheel or Magic
    Mouse.
  scope: user
  route: defaults
  values: {type: float, min: 0.0, max: 5.0}
  macos_default: not measured
  writes:
    - {domain: NSGlobalDomain, key: com.apple.scrollwheel.scaling, type: float}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Accessibility
  proven_on: {}
  not_yet_reason: ""
input.mouse_secondary_click:
  summary: 'Right-click on a Magic Mouse: off, right side or left
    side.'
  scope: user
  route: defaults
  values: ['off', right, left]
  macos_default: not measured
  writes:
    - domain: com.apple.AppleMultitouchMouse
      key: MouseButtonMode
      type: string
      map: {'off': OneButton, right: TwoButton, left: TwoButtonSwapped}
    - domain: com.apple.driver.AppleBluetoothMultitouch.mouse
      key: MouseButtonMode
      type: string
      map: {'off': OneButton, right: TwoButton, left: TwoButtonSwapped}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Mouse
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
  notes: 'The same key sits in two domains. TwoButtonSwapped is
    a guess. Research note on when it takes effect: restart (reported).'
input.mouse_smart_zoom:
  summary: Double-tap a Magic Mouse with one finger to zoom.
  scope: user
  route: defaults
  values: ['off', 'on']
  macos_default: not measured
  writes:
    - domain: com.apple.AppleMultitouchMouse
      key: MouseOneFingerDoubleTapGesture
      type: int
      map: {'off': 0, 'on': 1}
    - domain: com.apple.driver.AppleBluetoothMultitouch.mouse
      key: MouseOneFingerDoubleTapGesture
      type: int
      map: {'off': 0, 'on': 1}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Mouse
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
input.mouse_speed:
  summary: How fast the pointer moves when using a mouse.
  scope: user
  route: defaults
  values: {type: float, min: 0.0, max: 3.0}
  macos_default: not measured
  writes:
    - {domain: NSGlobalDomain, key: com.apple.mouse.scaling, type: float}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Mouse
  proven_on: {}
  not_yet_reason: ""
  notes: 'Research note on when it takes effect: a restart, one
    source says; logout not tested.'
input.mouse_swipe_between_pages:
  summary: Scroll left or right with one finger on a Magic Mouse
    to change pages.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: NSGlobalDomain, key: AppleEnableMouseSwipeNavigateWithScrolls, type: bool}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Mouse
  proven_on: {}
  not_yet_reason: ""
input.mouse_swipe_full_screen_apps:
  summary: Swipe left or right with two fingers on a Magic Mouse
    to change full-screen apps.
  scope: user
  route: defaults
  values: ['off', 'on']
  macos_default: not measured
  writes:
    - domain: com.apple.AppleMultitouchMouse
      key: MouseTwoFingerHorizSwipeGesture
      type: int
      map: {'off': 0, 'on': 2}
    - domain: com.apple.driver.AppleBluetoothMultitouch.mouse
      key: MouseTwoFingerHorizSwipeGesture
      type: int
      map: {'off': 0, 'on': 2}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Mouse
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
input.natural_scrolling:
  summary: Content moves the same way as your fingers (natural
    scrolling).
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: NSGlobalDomain, key: com.apple.swipescrolldirection, type: bool}
  takes_effect: logout
  needs: []
  lockout_risk: false
  where: System Settings > Trackpad
  proven_on: {}
  not_yet_reason: ""
  notes: 'One key for trackpad and mouse; both panes show it.
    Research note on when it takes effect: logout for a defaults
    write (reported).'
input.notification_center_gesture:
  summary: Swipe left from the right edge with two fingers to
    open Notification Center.
  scope: user
  route: defaults
  values: ['off', 'on']
  macos_default: not measured
  writes:
    - domain: com.apple.AppleMultitouchTrackpad
      key: TrackpadTwoFingerFromRightEdgeSwipeGesture
      type: int
      map: {'off': 0, 'on': 3}
    - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
      key: TrackpadTwoFingerFromRightEdgeSwipeGesture
      type: int
      map: {'off': 0, 'on': 3}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Trackpad
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
input.pinch_zoom:
  summary: Pinch with two fingers to zoom in or out.
  scope: user
  route: defaults
  values: ['off', 'on']
  macos_default: not measured
  writes:
    - domain: com.apple.AppleMultitouchTrackpad
      key: TrackpadPinch
      type: int
      map: {'off': 0, 'on': 1}
    - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
      key: TrackpadPinch
      type: int
      map: {'off': 0, 'on': 1}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Trackpad
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
input.pointer_acceleration:
  summary: Speed the pointer up when you move the mouse faster.
  scope: user
  route: defaults
  values: ['off', 'on']
  macos_default: not measured
  writes:
    - domain: NSGlobalDomain
      key: com.apple.mouse.linear
      type: bool
      map: {'on': false, 'off': true}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Mouse
  proven_on: {}
  not_yet_reason: ""
  notes: 'The stored key is inverted (true turns acceleration
    off); the choices keep the plain meaning. Research note on
    when it takes effect: a restart, one source says.'
input.quiet_click:
  summary: Make trackpad clicks quieter (Quiet Click; Silent clicking
    on macOS 15).
  scope: user
  route: defaults
  values: ['off', 'on']
  macos_default: not measured
  writes:
    - domain: com.apple.AppleMultitouchTrackpad
      key: ActuationStrength
      type: int
      map: {'on': 0, 'off': 1}
    - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
      key: ActuationStrength
      type: int
      map: {'on': 0, 'off': 1}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Trackpad
  proven_on: {}
  not_yet_reason: ""
  notes: Force Touch trackpads only.
input.repeat_delay:
  summary: Wait before a held key starts repeating. Smaller is
    shorter; the slider runs from 120 to 15.
  scope: user
  route: defaults
  values: {type: int, min: 10, max: 120}
  macos_default: not measured
  writes:
    - {domain: NSGlobalDomain, key: InitialKeyRepeat, type: int}
  takes_effect: logout
  needs: []
  lockout_risk: false
  where: System Settings > Keyboard
  proven_on: {}
  not_yet_reason: ""
  notes: The slider's leftmost 'Off' position has an unknown native
    value.
input.rotate:
  summary: Rotate items with two fingers.
  scope: user
  route: defaults
  values: ['off', 'on']
  macos_default: not measured
  writes:
    - domain: com.apple.AppleMultitouchTrackpad
      key: TrackpadRotate
      type: int
      map: {'off': 0, 'on': 1}
    - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
      key: TrackpadRotate
      type: int
      map: {'off': 0, 'on': 1}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Trackpad
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
input.secondary_click:
  summary: How to right-click on the trackpad.
  scope: user
  route: defaults
  values: [two_finger, bottom_right, bottom_left, 'off']
  macos_default: not measured
  writes:
    - domain: com.apple.AppleMultitouchTrackpad
      key: TrackpadRightClick
      type: bool
      map: {two_finger: true, bottom_right: false, bottom_left: false, 'off': false}
    - domain: com.apple.AppleMultitouchTrackpad
      key: TrackpadCornerSecondaryClick
      type: int
      map: {two_finger: 0, bottom_right: 2, bottom_left: 1, 'off': 0}
  takes_effect: not measured
  needs: []
  lockout_risk: false
  where: System Settings > Trackpad
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
  notes: One menu in System Settings sets two keys, plus the -currentHost copy.
    Written in the built-in trackpad domain only; a Bluetooth trackpad keeps
    its own copy.
input.show_desktop_gesture:
  summary: Spread thumb and three fingers to show the desktop.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: com.apple.dock, key: showDesktopGestureEnabled, type: bool}
  takes_effect: dock
  needs: []
  lockout_risk: false
  where: System Settings > Trackpad
  proven_on: {}
  not_yet_reason: ""
  notes: 'The pinch keys may also need writing. Research note
    on when it takes effect: Dock restart; not tested.'
input.show_input_menu:
  summary: Show the Input menu (keyboard layout picker) in the
    menu bar.
  scope: user
  route: defaults
  values: {type: bool}
  macos_default: not measured
  writes:
    - {domain: com.apple.TextInputMenu, key: visible, type: bool}
  takes_effect: not measured
