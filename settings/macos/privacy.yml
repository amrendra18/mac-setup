  needs: [click]
  lockout_risk: false
  where: System Settings > Privacy & Security > Location Services
  proven_on: {}
  not_yet_reason: ""
  notes: 'Reading works: the value sits in
    /var/db/locationd/Library/Preferences/ByHost/com.apple.locationd.<hardware id>.plist,
    readable as root with plutil. Writing it by script is not measured: the
    file belongs to _locationd.'
