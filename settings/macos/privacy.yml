privacy.improve_siri_dictation:
  summary: Share Siri and Dictation audio with Apple to improve
    them.
  scope: user
  route: defaults
  values: [not_asked, 'on', 'off']
  macos_default: not measured
  writes:
    - domain: com.apple.assistant.support
      key: Siri Data Sharing Opt-In Status
      type: int
      map: {not_asked: 0, 'on': 1, 'off': 2}
  takes_effect: logout
  needs: []
  lockout_risk: false
  where: System Settings > Privacy & Security > Analytics & Improvements
  proven_on: {}
  not_yet_reason: ""
  notes: 'Research note on when it takes effect: not checked;
    assistantd may cache it (guess).'
