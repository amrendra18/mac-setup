privacy.accessibility:
  summary: Apps allowed to control the Mac through Accessibility.
  scope: machine
  route: not_yet
  values: [not_yet]
  macos_default: not measured
  takes_effect: relaunch
  needs: [click]
  lockout_risk: false
  where: System Settings > Privacy & Security > Accessibility
  proven_on: {}
  not_yet_reason: macOS lets only a person grant this permission
    in System Settings; mac-setup cannot set it.
  notes: 'Research note on when it takes effect: The app usually
    needs a relaunch after a change (inferred). Page: x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension?Privacy_Accessibility'
