    pane. Turning it off by script is not yet measured.
time.server:
  summary: Network time server used to set the clock.
  scope: machine
  route: command
  values: {type: text, pattern: '^[A-Za-z0-9.-]{1,253}$'}
  macos_default: not measured
  command:
    read: [/usr/sbin/systemsetup, -getnetworktimeserver]
    parse: '^Network Time Server: (?P<value>\S+)$'
    set:
      - [/usr/sbin/systemsetup, -setnetworktimeserver, '{value}']
  takes_effect: live
  needs: []
  lockout_risk: false
  where: System Settings > General > Date & Time > Source
  proven_on: {}
  not_yet_reason: ""
  notes: The read's output is not measured on macOS 27.
time.set_automatically:
  summary: Set the date and time from a network time server.
  scope: machine
  route: command
  values: {type: bool}
  macos_default: not measured
  command:
    read: [/usr/sbin/systemsetup, -getusingnetworktime]
    parse: '^Network Time: (?P<value>On|Off)$'
    map: {true: 'On', false: 'Off'}
    set:
      true:
        - [/usr/sbin/systemsetup, -setusingnetworktime, 'on']
      false:
        - [/usr/sbin/systemsetup, -setusingnetworktime, 'off']
  takes_effect: live
  needs: []
  lockout_risk: false
  where: System Settings > General > Date & Time > Set time and
    date automatically
  proven_on: {}
  not_yet_reason: ""
  notes: The read's output is not measured on macOS 27.
time.zone:
  summary: Time zone, such as America/Vancouver. Used when automatic
    time zone is off.
  scope: machine
  route: command
  values: {type: text, pattern: '^[A-Za-z_]+(/[A-Za-z0-9_+-]+){0,2}$'}
  macos_default: not measured
  command:
    read: [/usr/bin/readlink, /etc/localtime]
    parse: ^/var/db/timezone/zoneinfo/(?P<value>\S+)$
    set:
      - [/usr/sbin/systemsetup, -settimezone, '{value}']
  takes_effect: live
  needs: [full_disk_access]
  lockout_risk: false
  where: System Settings > General > Date & Time > Closest city
  proven_on: {}
  not_yet_reason: ""
  notes: systemsetup prints Error -99 whether or not the set works, so the
    read after the set decides. Without Full Disk Access the time zone stays
    as it was. Measured on macOS 27.2.1 over SSH, in a local Terminal without
    Full Disk Access, and in one with it. The zone must be a name that
    systemsetup -listtimezones prints. GMT is one, Etc/UTC is not.
time.zone_automatic:
