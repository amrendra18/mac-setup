sharing.screen_sharing:
  summary: Let others see and control this screen (Screen Sharing).
  scope: machine
  route: command
  values: {type: bool}
  macos_default: not measured
  command:
    read: [/bin/launchctl, print, system/com.apple.screensharing]
    parse: '^exit: (?P<value>0|113)$'
    map: {true: '0', false: '113'}
    set:
      true:
        - [/bin/launchctl, enable, system/com.apple.screensharing]
        - - /bin/launchctl
          - bootstrap
          - system
          - /System/Library/LaunchDaemons/com.apple.screensharing.plist
      false:
        - [/bin/launchctl, disable, system/com.apple.screensharing]
  takes_effect: live
  needs: []
  lockout_risk: false
  where: System Settings > General > Sharing > Screen Sharing
  proven_on: {}
  not_yet_reason: ""
