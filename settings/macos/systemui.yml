battery.dim_on_battery:
  summary: Slightly dim the display on battery power (laptops).
  scope: machine
  route: command
  values: {type: bool}
  macos_default: not measured
  command:
    read: [/usr/bin/pmset, -g, custom]
    parse: ^ lessbright +(?P<value>\d+)$
    map: {true: '1', false: '0'}
    set:
      true:
        - [/usr/bin/pmset, -b, lessbright, '1']
      false:
        - [/usr/bin/pmset, -b, lessbright, '0']
  takes_effect: live
  needs: []
  lockout_risk: false
  where: System Settings > Battery
  proven_on: {}
  not_yet_reason: ""
  notes: 'Only Macs with a battery list lessbright. No test Mac
    had a battery, so the read''s output is not measured on macOS
    27. Research note on when it takes effect: none (guess).'
