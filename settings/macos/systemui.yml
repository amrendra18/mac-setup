        sonar: /System/Library/Sounds/Ping.aiff
        sonumi: /System/Library/Sounds/Sosumi.aiff
        submerge: /System/Library/Sounds/Submarine.aiff
  takes_effect: live
  needs: []
  lockout_risk: false
  where: System Settings > Sound
