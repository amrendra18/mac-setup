---
appearance.accent_color:
  summary: Accent color for buttons, menus, and controls.
  scope: user
  route: defaults
  values: [multicolor, blue, purple, pink, red, orange, yellow, green, graphite]
  macos_default: not measured
  writes:
    - domain: NSGlobalDomain
      key: AppleAccentColor
      type: int
      map: {multicolor: null, blue: 4, purple: 5, pink: 6, red: 0, orange: 1, yellow: 2, green: 3, graphite: -1}
  takes_effect: relaunch
  needs: []
  lockout_risk: false
  where: System Settings > Appearance
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
  notes: 'The stored numbers are common community values, not
    measured. Research note on when it takes effect: open apps
    redraw after a relaunch or logout (guess).'
appearance.highlight_color:
  summary: Color of selected text.
  scope: user
  route: defaults
  values: [accent, blue]
  macos_default: not measured
  writes:
    - domain: NSGlobalDomain
      key: AppleHighlightColor
      type: string
      map: {accent: null, blue: 0.698039 0.843137 1.000000 Blue}
  takes_effect: relaunch
  needs: []
  lockout_risk: false
  where: System Settings > Appearance
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
  notes: 'Only accent and blue are offered, because only the stored
    string for blue was read on a Mac. Research note on when it takes
    effect: apps pick it up after a relaunch (guess).'
