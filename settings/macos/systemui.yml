  summary: Alert volume, in percent.
  scope: user
  route: command
  values: {type: int, min: 0, max: 100}
  macos_default: not measured
  command:
    read: [/usr/bin/osascript, -e, get volume settings]
    parse: '^output volume:.*, alert volume:(?P<value>\d+),'
    set:
      - [/usr/bin/osascript, -e, on run argv, -e, set volume alert volume (item 1 of argv as integer), -e, end run, '{value}']
  takes_effect: live
  needs: []
  lockout_risk: false
  where: System Settings > Sound
  proven_on: {"27.2.1": "2026-11-12"}
  not_yet_reason: ""
  notes: 'The command runs in the session of the account that runs
    mac-setup. Another listed account gets it when that account runs
    mac-setup itself while signed in. This works without an Automation
    prompt (reported, not tested).
    The volume is stored as com.apple.sound.beep.volume in NSGlobalDomain,
    a number from 0 to 1 (not measured).'
