---
firefox.lock:
  summary: Lock supported Firefox settings when browser application becomes available.
  scope: machine
  route: not_yet
  values:
    type: bool
  macos_default: not measured
  takes_effect: relaunch
  needs: []
  lockout_risk: false
  where: Firefox > Settings
  proven_on: {}
  not_yet_reason: Browser application is not available yet.
  browser:
    family: firefox
    kind: lock_control
    read: []
    capture:
      class: scalar
    locked:
      source: none
      path: []
    unlocked:
      source: none
      path: []
    baseline:
      status: proposed
      value: true
    support:
      min: 158.0.1
      tested: 158.0.1
      source: https://firefox-admin-docs.mozilla.org/reference/policies/preferences/
      note: True selects the strongest supported native enforcement. False selects editable seeds or reports
        a named unsupported leaf. No published introduction version was identified for this exact mapping.
        Minimum uses the tested version.
    inventory:
      category: control
      policy: firefox.lock
      leaf: firefox.lock
      disposition: mapped
firefox.3rdparty.extensions:
  summary: Supply extension-managed configuration, defined by each extension. Field Extensions.
  scope: machine
  route: not_yet
  values:
    type: browser
    schema:
      type: object
      additionalProperties:
        anyOf:
          - type: object
            additionalProperties: true
          - type: array
            items:
              type: object
              additionalProperties: true
  macos_default: not measured
  takes_effect: relaunch
  needs: []
  lockout_risk: false
  where: Firefox > Settings
  proven_on: {}
  not_yet_reason: Browser application is not available yet.
  browser:
    family: firefox
    kind: setting
    read:
      - source: firefox_policy
        path: [3rdparty, Extensions]
        type: object
        conversion: identity
    capture:
      class: mask
      reason: This value can contain private names, paths, URLs, identifiers, or browser content.
    locked:
      source: firefox_policy
      path: [3rdparty, Extensions]
      level: mandatory
    unlocked:
      unsupported: leave unset. Extension-managed storage stays managed; no generic editable equivalent.
    baseline:
      status: proposed
      reason: Leave unset. Extension settings can contain secrets. No arbitrary managed payload in the
        public baseline.
    support:
      min: '68'
      tested: 158.0.1
      source: https://raw.githubusercontent.com/mozilla/enterprise-admin-reference/main/schema/policies-schema.json
      note: Enforced extension storage; extension defines its controls. leave unset. Extension-managed storage
        stays managed; no generic editable equivalent. Read-back reports policy requests and user overrides
        separately. Effective locks need a running-browser check. Minimum follows Mozilla Firefox compatibility
        for 3rdparty.Extensions.
    inventory:
      category: policy
      policy: 3rdparty
      leaf: 3rdparty.Extensions
      disposition: masked
      reason: This value can contain private names, paths, URLs, identifiers, or browser content.
firefox.ai_controls.default.value:
  summary: Allow or block individual AI functions, including local models. Field Default.Value.
  scope: machine
  route: not_yet
  values: [available, blocked]
  macos_default: not measured
  takes_effect: relaunch
  needs: []
  lockout_risk: false
  where: Firefox > Settings
  proven_on: {}
  not_yet_reason: Browser application is not available yet.
  browser:
    family: firefox
    kind: setting
    read:
      - source: firefox_policy
        path: [AIControls, Default, Value]
        type: text
        conversion: identity
      - source: firefox_prefs
        path: [browser.ai.control.default]
        type: text
        conversion: identity
      - source: firefox_user
        path: [browser.ai.control.default]
        type: text
        conversion: identity
    capture:
      class: enum
      choices: [available, blocked]
    locked:
      source: firefox_policy
      path: [AIControls, Default, Value]
      level: mandatory
    unlocked:
      source: firefox_policy
      path: [AIControls, Default, Value]
      level: recommended
    baseline:
      status: proposed
      value: blocked
      reason: Keep every AI function blocked unless an individual function is enabled.
    support:
      min: 149.0.2
      tested: 158.0.1
      source: https://raw.githubusercontent.com/mozilla/enterprise-admin-reference/main/schema/policies-schema.json
      note: Optional Locked flag. Use Locked:false for scalar defaults. Existing user values can win. Read-back
        reports policy requests and user overrides separately. Effective locks need a running-browser check.
        The corresponding native Locked control must be false in unlocked mode. Minimum follows Mozilla Firefox
        compatibility for AIControls.Default.Value.
    inventory:
      category: policy
      policy: AIControls
      leaf: AIControls.Default.Value
      disposition: mapped
