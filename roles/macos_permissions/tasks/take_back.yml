---
- name: Take back each permission this run turned on for itself
  ansible.builtin.include_tasks: give_back.yml
  loop: "{{ macos_permissions_items | macos_permissions_take_back(macos_permissions_results | default({})) }}"
  loop_control:
    loop_var: macos_permissions_item
    label: "{{ macos_permissions_item.id }}"

- name: Write the permission lines of the summary
  ansible.builtin.set_fact:
    macos_permissions_summary: >-
      {{ macos_permissions_items | macos_permissions_notes(macos_permissions_results | default({}),
      macos_permissions_outcomes | default({}), macos_permissions_run_mode, macos_permissions_app_name) }}
