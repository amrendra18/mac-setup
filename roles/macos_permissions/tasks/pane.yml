---
- name: Test {{ macos_permissions_item.name }}
  ansible.builtin.include_tasks: test.yml

- name: Keep the first state of {{ macos_permissions_item.name }}
  ansible.builtin.set_fact:
    macos_permissions_state_before: "{{ macos_permissions_state_now }}"

- name: Say what a run would ask for {{ macos_permissions_item.name }}
  ansible.builtin.debug:
    msg: "{{ macos_permissions_item | macos_permissions_list_line(macos_permissions_state_before, macos_permissions_app_name) }}"
  when: not macos_permissions_run_mode.ask

- name: Ask for {{ macos_permissions_item.name }}
  ansible.builtin.include_tasks: ask.yml
  vars:
    macos_permissions_lines: "{{ macos_permissions_item | macos_permissions_ask_lines(macos_permissions_app_name) }}"
  when:
    - macos_permissions_run_mode.ask
    - macos_permissions_state_before == 'off'

- name: Record {{ macos_permissions_item.name }}
  ansible.builtin.set_fact:
    macos_permissions_results: "{{ macos_permissions_results | default({}) | combine({macos_permissions_item.id: macos_permissions_record}) }}"
  vars:
    macos_permissions_record:
      before: "{{ macos_permissions_state_before }}"
      after: "{{ macos_permissions_state_now }}"
