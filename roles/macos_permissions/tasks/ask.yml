---
- name: Say what to change for {{ macos_permissions_item.name }}
  ansible.builtin.debug:
    msg: "{{ macos_permissions_lines }}"

- name: Open the page for {{ macos_permissions_item.name }}
  ansible.builtin.command:
    argv: ["{{ macos_permissions_open }}", "{{ macos_permissions_item.link }}"]
  changed_when: false
  failed_when: false
  check_mode: false

- name: Wait while you change {{ macos_permissions_item.name }}
  ansible.builtin.pause:
    prompt: Press Return when done

- name: Test again for {{ macos_permissions_item.name }}
  ansible.builtin.include_tasks: test.yml
