---
- name: Say why this run asks for no permission
  ansible.builtin.debug:
    msg: "{{ macos_permissions_run_mode.reason }}"
  when:
    - macos_permissions_items | length > 0
    - not macos_permissions_run_mode.ask

- name: Ask for or test each permission
  ansible.builtin.include_tasks: "{{ macos_permissions_item.ask }}.yml"
  loop: "{{ macos_permissions_items }}"
  loop_control:
    loop_var: macos_permissions_item
    label: "{{ macos_permissions_item.id }}"

- name: Work out the settings this run may not write
  ansible.builtin.set_fact:
    macos_permissions_blocked: "{{ macos_permissions_items | macos_permissions_blocked(macos_permissions_results | default({})) }}"
