---
- name: Read which account owns the screen
  ansible.builtin.command: stat -f %Su /dev/console
  register: macos_defaults_screen_owner
  check_mode: false
  changed_when: false
  when: macos_defaults_restart

- name: Write each setting
  ansible.builtin.include_tasks: write.yml
  loop: "{{ macos_defaults_writes }}"
  loop_control:
    loop_var: macos_defaults_write
    label: "{{ macos_defaults_write.id }}"
