---
- name: Open the page for {{ macos_by_hand_item.id }}
  ansible.builtin.command:
    argv: ["{{ macos_by_hand_open }}", "{{ macos_by_hand_item.link }}"]
  register: macos_by_hand_opened
  changed_when: false
  failed_when: false
  check_mode: false

- name: Say the page did not open for {{ macos_by_hand_item.id }}
  ansible.builtin.debug:
    msg: "could not open the page; go to {{ macos_by_hand_item.where }} yourself"
  when: macos_by_hand_opened.rc != 0

- name: Say what to choose for {{ macos_by_hand_item.id }}
  ansible.builtin.debug:
    msg:
      - "In {{ macos_by_hand_item.where }}"
      - "{{ macos_by_hand_item.choose }}"

- name: Wait while you choose {{ macos_by_hand_item.id }}
  ansible.builtin.pause:
    prompt: Press Return when done
