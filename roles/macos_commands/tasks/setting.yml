---
- name: "Set {{ macos_commands_item.id }}"
  block:
    - name: "Set {{ macos_commands_item.id }}"
      macos_command_setting:
        read: "{{ macos_commands_item.read }}"
        parse: "{{ macos_commands_item.parse }}"
        map: "{{ macos_commands_item.map }}"
        refuse: "{{ macos_commands_item.refuse }}"
        set: "{{ macos_commands_item.set }}"
        value: "{{ macos_commands_item.value }}"
        write_allowed: "{{ macos_commands_item.id not in macos_commands_blocked }}"
        needs: "{{ macos_commands_item.needs }}"
      register: macos_commands_result

    - name: "Record whether a run without the permission skipped or matched {{ macos_commands_item.id }}"
      ansible.builtin.include_role:
        name: macos_permissions
        tasks_from: record
      vars:
        macos_permissions_record_ids: ["{{ macos_commands_item.id }}"]
        macos_permissions_record_outcome: "{{ 'skipped' if macos_commands_result is skipped else 'matched' }}"
      when: macos_commands_item.id in macos_commands_blocked
  rescue:
    - name: "Record the refusal of {{ macos_commands_item.id }}"
      ansible.builtin.include_tasks: "{{ role_path }}/../macos_defaults/tasks/refused.yml"
      vars:
        macos_defaults_refused_account: "{{ macos_commands_account }}"
        macos_defaults_refused_id: "{{ macos_commands_item.id }}"
