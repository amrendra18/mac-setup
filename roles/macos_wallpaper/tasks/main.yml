---
- name: Set the desktop colour
  when: macos_wallpaper_items.color is defined
  vars:
    macos_wallpaper_later: "{{ macos_wallpaper_other_account and ansible_failed_result.no_screen | default(false) }}"
  block:
    - name: Set desktop.wallpaper
      macos_wallpaper:
        color: "{{ macos_wallpaper_items.color }}"
  rescue:
    - name: Note that desktop.wallpaper waits until the account signs in
      ansible.builtin.set_fact:
        macos_wallpaper_waiting: "{{ macos_wallpaper_waiting | default([]) + [macos_wallpaper_account] }}"
      when: macos_wallpaper_later | bool

    - name: Record the refusal of desktop.wallpaper
      ansible.builtin.include_tasks: "{{ role_path }}/../macos_defaults/tasks/refused.yml"
      vars:
        macos_defaults_refused_account: "{{ macos_wallpaper_account }}"
        macos_defaults_refused_id: desktop.wallpaper
      when: not macos_wallpaper_later | bool
