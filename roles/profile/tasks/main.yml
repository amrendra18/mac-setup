---
- name: Read this Mac's local hostname
  ansible.builtin.command: /usr/sbin/scutil --get LocalHostName
  register: profile_local_hostname
  changed_when: false
  check_mode: false
  when: groups['macs'] | length > 1

- name: Stop when no profile entry is named after this Mac
  ansible.builtin.fail:
    msg: >-
      local hostname: this Mac is {{ profile_local_hostname.stdout }}, and the profile lists
      {{ groups['macs'] | join(', ') }}; name an entry's hosts.yml key and its host_vars folder after
      this Mac, or change its local hostname in System Settings > General > Sharing
  run_once: true
  when:
    - groups['macs'] | length > 1
    - profile_local_hostname.stdout not in groups['macs']

- name: Skip the profile entries of other Macs
  ansible.builtin.meta: end_host
  when:
    - groups['macs'] | length > 1
    - inventory_hostname != profile_local_hostname.stdout

- name: Check the profile
  ansible.builtin.fail:
    msg: "{{ profile_problem_lines | join('\n') }}"
  vars:
    profile_problem_lines: "{{ hostvars[inventory_hostname] | profile_problems(profile_reference_files, profile_app_catalog) }}"
  when: profile_problem_lines | length > 0

- name: Read the running account
  ansible.builtin.command: id -un
  register: profile_id
  changed_when: false
  check_mode: false

- name: Build the work lists
  ansible.builtin.set_fact:
    profile_running_account: "{{ profile_id.stdout }}"
    profile_run_mode: "{{ query('ansible.builtin.env', 'SSH_CONNECTION', 'SSH_CLIENT', 'SSH_TTY') | profile_mode(ansible_check_mode) }}"
    profile_own_work: "{{ profile_work.own }}"
    profile_other_work: "{{ profile_work.others }}"
    profile_machine_writes: "{{ profile_work.machine_writes }}"
    profile_commands: "{{ profile_work.commands }}"
    profile_apps: "{{ profile_work.apps }}"
    profile_by_hand: "{{ profile_work.by_hand }}"
    profile_permissions: "{{ profile_work.permissions }}"
    profile_accounts: "{{ profile_work.accounts }}"
    profile_counts: "{{ profile_work.counts }}"
  vars:
    profile_work: "{{ hostvars[inventory_hostname] | profile_work(profile_reference_files, profile_id.stdout, profile_permission_table) }}"
